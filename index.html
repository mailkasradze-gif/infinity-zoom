<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Office Infinity Zoom - Complete</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background-color: #000; overflow: hidden;
      -webkit-user-select: none; user-select: none; touch-action: none;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #openseadragon1 { width: 100vw; height: 100vh; }
    
    /* ღილაკების განთავსება ქვედა მხარეს ცენტრში */
    .controls-container {
      position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; flex-direction: row; gap: 12px;
    }
    .action-btn {
      display: flex; align-items: center; justify-content: center; 
      width: 48px; height: 48px; padding: 0;
      background: rgba(20, 20, 30, 0.75); backdrop-filter: blur(12px);
      color: #fff; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px; font-size: 18px; cursor: pointer;
    }

    .progress-bar-container {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: 50%; max-width: 380px; height: 6px; background: rgba(255, 255, 255, 0.1);
      border-radius: 3px; overflow: hidden; z-index: 1000;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #00d2ff, #b224ef, #f12711);
      transition: width 0.1s ease-out;
    }
    /* დამტვირთავი ეკრანი (Loading Screen) */
    #loader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 9999; display: flex;
      justify-content: center; align-items: center; color: #fff;
      font-size: 20px; font-weight: 600; transition: opacity 0.5s ease;
    }
  </style>
</head>
<body>

  <div id="loader">იტვირთება...</div>

  <div class="controls-container">
    <button class="action-btn" id="reset-btn" title="საწყისი ხედი">🔄</button>
    <button class="action-btn" id="zoom-in-btn" title="Zoom In">➕</button>
    <button class="action-btn" id="zoom-out-btn" title="Zoom Out">➖</button>
    <button class="action-btn" id="fullscreen-btn" title="მთელს ეკრანზე">⛶</button>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <div id="openseadragon1"></div>

  <script>
    var viewer = OpenSeadragon({
      id: "openseadragon1",
      prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/images/",
      tileSources: [
        { type: 'image', url: 'o1.png' },
        { type: 'image', url: 'o2.png' },
        { type: 'image', url: 'o3.png' },
        { type: 'image', url: 'o4.png' },
        { type: 'image', url: 'o5.png' },
        { type: 'image', url: 'o6.png' },
        { type: 'image', url: 'o7.png' },
        { type: 'image', url: 'o8.png' }
      ],
      showNavigationControl: false,
      animationTime: 2.2,
      springStiffness: 3.5,
      minZoomLevel: 0.5,
      maxZoomLevel: Infinity,
      visibilityRatio: 1.0,
      homeFillsViewer: true, // ვრთავთ True-ს, რათა პირველი ფოტო სრულად ჩაჯდეს ჰორიზონტალურად (Fit width)
      panHorizontal: true,
      panVertical: true,
      gestureSettingsTouch: { pinchToZoom: true, scrollToZoom: true, clickToZoom: true, dragToPan: true },
      gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true, dragToPan: true, scrollToZoom: true }
    });

    var laptopCoords = [
      { x: 0.3375, y: 0.4572, w: 0.2524, h: 0.2786 }, // o1 -> o2
      { x: 0.4540, y: 0.3372, w: 0.2107, h: 0.2104 }, // o2 -> o3
      { x: 0.3895, y: 0.2920, w: 0.2169, h: 0.2348 }, // o3 -> o4
      { x: 0.4609, y: 0.4240, w: 0.1701, h: 0.1590 }, // o4 -> o5
      { x: 0.2527, y: 0.1945, w: 0.5003, h: 0.5522 }, // o5 -> o6
      { x: 0.1978, y: 0.3799, w: 0.2841, h: 0.3340 }, // o6 -> o7
      { x: 0.2763, y: 0.1494, w: 0.2033, h: 0.2239 }  // o7 -> o8
    ];

    var centers = [];

    viewer.addHandler('open', function() {
      var items = [];
      for (var i = 0; i < viewer.world.getItemCount(); i++) {
        items.push(viewer.world.getItemAt(i));
      }

      if (items.length > 0) {
        var b0 = items[0].getBounds();
        centers[0] = new OpenSeadragon.Point(b0.x + b0.width / 2, b0.y + b0.height / 2);
      }

      var prevBounds = items[0].getBounds();

      for (var i = 1; i < items.length; i++) {
        var img = items[i];
        var c = laptopCoords[i - 1];

        img.setOpacity(0);
        
        let targetX = prevBounds.x + prevBounds.width * c.x;
        let targetY = prevBounds.y + prevBounds.height * c.y;
        let targetW = prevBounds.width * c.w;
        
        img.setWidth(targetW);
        img.setPosition(new OpenSeadragon.Point(targetX, targetY));

        prevBounds = img.getBounds();
        var curB = img.getBounds();
        centers[i] = new OpenSeadragon.Point(curB.x + curB.width / 2, curB.y + curB.height / 2);
      }

      // goHome() იყენებს homeFillsViewer პარამეტრს და ათანაბრებს ფოტოს ეკრანის სიგანეზე, თან აცენტრებს ზუსტად შუაში
      viewer.viewport.goHome(true);

      setTimeout(function() {
        var startTime = performance.now();
        function fadeInImages(currentTime) {
          var progress = Math.min((currentTime - startTime) / 1000, 1);
          for (var i = 1; i < items.length; i++) {
            items[i].setOpacity(progress);
          }
          if (progress < 1) {
            requestAnimationFrame(fadeInImages);
          } else {
            var loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
          }
        }
        requestAnimationFrame(fadeInImages);
      }, 1000);
    });

    function getActiveCenter() {
      var currentZoom = viewer.viewport.getZoom();
      if (currentZoom > 3000 && centers[7]) return centers[7];
      if (currentZoom > 1500 && centers[6]) return centers[6];
      if (currentZoom > 600 && centers[5]) return centers[5];
      if (currentZoom > 250 && centers[4]) return centers[4];
      if (currentZoom > 60 && centers[3]) return centers[3];
      if (currentZoom > 15 && centers[2]) return centers[2];
      if (currentZoom > 2.5 && centers[1]) return centers[1];
      return centers[0] || new OpenSeadragon.Point(0.5, 0.5);
    }

    viewer.addHandler('zoom', function() {
      viewer.viewport.panTo(getActiveCenter(), false);
      var currentZoom = viewer.viewport.getZoom();
      var progress = Math.min(Math.max((currentZoom - 1) / 150, 0), 1) * 100;
      document.getElementById('progress-fill').style.width = progress + '%';
    });

    // საწყისი ღილაკი აბრუნებს ფოტოს თავდაპირველ Fit სიგანისა და სრულად ცენტრალურ მდგომარეობაში
    document.getElementById('reset-btn').addEventListener('click', () => {
      viewer.viewport.goHome(true);
    });

    document.getElementById('zoom-in-btn').addEventListener('click', () => viewer.viewport.zoomTo(viewer.viewport.getZoom() * 1.4, getActiveCenter(), false));
    document.getElementById('zoom-out-btn').addEventListener('click', () => viewer.viewport.zoomTo(viewer.viewport.getZoom() * 0.7, getActiveCenter(), false));
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    });
  </script>
</body>
</html>
